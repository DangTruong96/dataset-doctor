[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-doctor"
version = "0.2.2"
description = "Pre-flight checks for fine-tuning / eval JSONL datasets: format validation with line numbers, duplicate and leakage detection, dedupe and split."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "DangTruong96" },
]
keywords = ["jsonl", "fine-tuning", "dataset", "validation", "llm", "dedupe"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
dataset-doctor = "dataset_doctor:main"

[project.urls]
Homepage = "https://github.com/DangTruong96/dataset-doctor"

[tool.setuptools]
py-modules = ["dataset_doctor"]
