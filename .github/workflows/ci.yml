name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the unit test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the bundled examples
        run: |
          python dataset_doctor.py check examples/good.jsonl
          python dataset_doctor.py dedupe examples/dupes.jsonl --normalized -o /tmp/clean.jsonl
          python dataset_doctor.py check /tmp/clean.jsonl
